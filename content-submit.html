<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cozy Corner Cafe | Community Submissions</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link
        rel="stylesheet"
        href="product-management.css">

    <link
        rel="stylesheet"
        href="signup.css">
</head>

<body>

    <!-- NAVIGATION -->
    <nav class="navbar navbar-dark cafe-navbar">
        <div class="container">

            <a
                href="index.html"
                class="navbar-brand fw-bold">
                ☕ Cozy Corner Cafe
            </a>

            <a
                href="moderator.html"
                class="btn btn-outline-light btn-sm">
                Moderator
            </a>

        </div>
    </nav>

    <!-- COMMUNITY CONTENT -->
    <main
        class="container py-5"
        style="max-width: 760px;">

        <h1>Share with Our Cafe Community</h1>

        <p>
            Share a cafe story, recipe idea or
            community event for moderator review.
        </p>

        <div
            id="submissionMessage"
            role="status"
            hidden>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-4">

                <form id="submissionForm">

                    <!-- TITLE -->
                    <div class="mb-3">
                        <label
                            for="title"
                            class="form-label">
                            Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            class="form-control"
                            required
                            minlength="5"
                            maxlength="120">
                    </div>

                    <!-- AUTHOR -->
                    <div class="mb-3">
                        <label
                            for="author"
                            class="form-label">
                            Author Name
                        </label>

                        <input
                            type="text"
                            id="author"
                            class="form-control"
                            required
                            minlength="2"
                            maxlength="100">
                    </div>

                    <!-- CATEGORY -->
                    <div class="mb-3">
                        <label
                            for="category"
                            class="form-label">
                            Category
                        </label>

                        <select
                            id="category"
                            class="form-select"
                            required>

                            <option value="">
                                Select Category
                            </option>

                            <option value="Cafe Story">
                                Cafe Story
                            </option>

                            <option value="Recipe Idea">
                                Recipe Idea
                            </option>

                            <option value="Community Event">
                                Community Event
                            </option>

                        </select>
                    </div>

                    <!-- CONTENT -->
                    <div class="mb-3">
                        <label
                            for="content"
                            class="form-label">
                            Content
                        </label>

                        <textarea
                            id="content"
                            class="form-control"
                            rows="6"
                            required
                            minlength="20"
                            maxlength="5000"></textarea>
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary">
                        Submit for Review
                    </button>

                </form>

            </div>
        </div>
    </main>

    <script src="content-submit.js"></script>
</body>

</html>
