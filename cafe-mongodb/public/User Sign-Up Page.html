
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Cozy Corner Cafe | User Sign-Up</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <link rel="stylesheet" href="product-management.css">
  <link rel="stylesheet" href="signup.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg cafe-navbar">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">
      ☕ Cozy Corner Cafe
    </a>

    <a href="index.html" class="nav-link">Home</a>
  </div>
</nav>

<main class="container mt-5" style="max-width:700px">

  <div class="card shadow-sm">
    <div class="card-header">
      <h1 class="h3 mb-0">Join the Cozy Corner Cafe</h1>
    </div>

    <div class="card-body">
      <p>
        Our rewards-list sign-up is a local classroom
        demonstration, not a login account.
      </p>

      <button
        type="button"
        class="btn btn-primary btn-lg"
        style="background-color:#854842;color:whitesmoke"
        data-bs-toggle="modal"
        data-bs-target="#signupModal">

        Create a Cafe Account

      </button>
    </div>
  </div>

</main>

<div class="modal fade"
     id="signupModal"
     tabindex="-1"
     aria-labelledby="signupTitle"
     aria-hidden="true">

  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h4 class="modal-title" id="signupTitle">
          Create Your Cafe User Account!
        </h4>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <form>

          <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" class="form-control"
                   id="name" required>
          </div>

          <div class="mb-3">
            <label for="age" class="form-label">Age</label>
            <input type="number" class="form-control"
                   id="age" min="1" max="120" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">
              Email Address
            </label>
            <input type="email" class="form-control"
                   id="email" required>
          </div>

          <div class="mb-3">
            <label for="address" class="form-label">
              Street Address
            </label>
            <input type="text" class="form-control"
                   id="address" required>
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label">
              Phone Number (optional)
            </label>
            <input type="tel" class="form-control" id="phone">
          </div>

          <button
            type="submit"
            class="btn btn-success btn-lg w-100"
            style="background-color:#854842;color:whitesmoke">

            Create Account

          </button>

        </form>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="register.js"></script>

</body>
</html>
