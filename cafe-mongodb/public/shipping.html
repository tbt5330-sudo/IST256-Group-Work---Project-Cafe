<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cozy Corner Cafe | Shipping</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link
        rel="stylesheet"
        href="product-management.css">

    <link
        rel="stylesheet"
        href="signup.css">
</head>

<body>
    <!-- NAVIGATION -->
    <nav class="navbar navbar-dark cafe-navbar">
        <div class="container">
            <a
                href="index.html"
                class="navbar-brand fw-bold">
                ☕ Cozy Corner Cafe
            </a>

            <a
                href="cafe-shopping-cart.html"
                class="btn btn-outline-light btn-sm">
                Back to Cart
            </a>
        </div>
    </nav>

    <main
        class="container py-5"
        style="max-width: 760px;">

        <p class="text-muted">
            Shopping Cart / Shipping / Billing
        </p>

        <h1 class="mb-3">Shipping Details</h1>

        <p>
            Please enter your delivery information.
            Use fictional details for this classroom demonstration.
        </p>

        <div
            id="shippingMessage"
            class="alert alert-danger"
            role="alert"
            hidden>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-4">

                <form id="shippingForm">

                    <!-- FULL NAME -->
                    <div class="mb-3">
                        <label
                            for="fullName"
                            class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            class="form-control"
                            required
                            minlength="2"
                            maxlength="120">
                    </div>

                    <!-- EMAIL -->
                    <div class="mb-3">
                        <label
                            for="email"
                            class="form-label">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            required>
                    </div>

                    <!-- STREET ADDRESS -->
                    <div class="mb-3">
                        <label
                            for="address"
                            class="form-label">
                            Street Address
                        </label>

                        <input
                            type="text"
                            id="address"
                            class="form-control"
                            required
                            minlength="5"
                            maxlength="300">
                    </div>

                    <div class="row g-3 mb-3">

                        <!-- CITY -->
                        <div class="col-md-6">
                            <label
                                for="city"
                                class="form-label">
                                City
                            </label>

                            <input
                                type="text"
                                id="city"
                                class="form-control"
                                required>
                        </div>

                        <!-- STATE -->
                        <div class="col-md-3">
                            <label
                                for="state"
                                class="form-label">
                                State
                            </label>

                            <input
                                type="text"
                                id="state"
                                class="form-control"
                                placeholder="PA"
                                pattern="[A-Za-z]{2}"
                                maxlength="2"
                                required>
                        </div>

                        <!-- ZIP CODE -->
                        <div class="col-md-3">
                            <label
                                for="zip"
                                class="form-label">
                                ZIP Code
                            </label>

                            <input
                                type="text"
                                id="zip"
                                class="form-control"
                                pattern="[0-9]{5}(-[0-9]{4})?"
                                maxlength="10"
                                required>
                        </div>
                    </div>

                    <!-- SHIPPING PRICE -->
                    <div
                        class="alert alert-light border d-flex justify-content-between">
                        <span>Standard Shipping</span>
                        <strong>$2.00</strong>
                    </div>

                    <!-- SUBMIT BUTTON -->
                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                        id="shippingButton"
                        disabled>
                        Continue to Billing
                    </button>

                </form>
            </div>
        </div>
    </main>

    <script src="shipping.js"></script>
</body>

</html>
